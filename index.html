<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07172d"><title>Rivosa Technology | Evalúa tu teléfono</title>
<style>
:root{--blue:#0751dc;--blue2:#0a35a5;--teal:#00c9a7;--navy:#06162d;--ink:#11243c;--muted:#6b7b90;--line:#e4ebf4;--bg:#f3f7fc;--white:#fff;--shadow:0 18px 55px rgba(5,25,55,.08)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#f3f7fc 0%,#edf4fb 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);min-height:100vh}
button,input,select{font:inherit}
header{background:var(--navy);color:#fff;padding:14px clamp(16px,4vw,42px);display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:78px;border-bottom:1px solid rgba(0,201,167,.2)}
brand{display:flex;align-items:center;min-width:0}brand img{display:block;width:min(155px,38vw);height:48px;max-width:100%;object-fit:contain;object-position:left center}
.tag{font-size:11px;color:#d3e0f0;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);padding:8px 12px;border-radius:999px;letter-spacing:.08em;white-space:nowrap}
.wrap{width:min(100% - 32px,760px);margin:clamp(28px,5vw,54px) auto;padding:0}
.hero{text-align:center;margin:0 auto 28px;max-width:650px}.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--blue);font-weight:850;font-size:11px;letter-spacing:.15em;text-transform:uppercase;background:#e6efff;border:1px solid #d8e6ff;border-radius:999px;padding:8px 12px}.hero h1{font-size:clamp(29px,5vw,43px);letter-spacing:-.04em;line-height:1.1;margin:15px 0 10px;color:var(--navy)}.hero p{color:var(--muted);margin:0 auto;max-width:540px;line-height:1.65;font-size:15px}
.card{background:var(--white);border:1px solid rgba(210,222,236,.9);border-radius:24px;padding:clamp(20px,4vw,34px);box-shadow:var(--shadow)}
.progress-top{display:flex;align-items:center;justify-content:space-between;color:#73839a;font-size:12px;font-weight:750;margin-bottom:10px}.progress-top span:last-child{color:var(--blue);background:#edf4ff;padding:5px 9px;border-radius:999px}.progress{height:8px;background:#edf1f6;border-radius:99px;overflow:hidden;margin-bottom:30px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:99px;transition:width .3s ease}
.step h2{font-size:clamp(21px,3vw,26px);letter-spacing:-.025em;margin:0 0 8px;color:var(--navy)}.step .help{color:var(--muted);margin:0 0 22px;font-size:14px;line-height:1.6}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.opt{position:relative;border:1.5px solid var(--line);background:linear-gradient(180deg,#fff,#fbfdff);border-radius:16px;padding:16px;text-align:left;cursor:pointer;transition:border-color .18s,box-shadow .18s,transform .18s;min-height:64px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:space-between}.opt:after{content:"＋";color:#9aabc0;font-size:16px;font-weight:500}.opt:hover{border-color:#7aa6ff;box-shadow:0 8px 24px #0a4bd00e;transform:translateY(-2px)}.opt.selected{border-color:var(--blue);background:linear-gradient(180deg,#f1f6ff,#e8f2ff);box-shadow:0 0 0 3px rgba(7,81,220,.08);color:var(--blue)}.opt.selected:after{content:"✓";color:var(--teal);font-weight:900}
.field{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;background:#fbfdff;margin:8px 0 12px;outline:none;color:var(--ink);transition:.15s}.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px #0751dc12;background:white}.label{font-weight:750;font-size:14px;display:block;margin-bottom:5px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:11px 15px;cursor:pointer;color:var(--ink);font-weight:650;transition:.15s}.chip:hover{border-color:#8bb0ff}.chip.selected{background:#e9f5ff;border-color:var(--blue);color:var(--blue);font-weight:800;box-shadow:0 0 0 2px #0751dc12}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.check{border:1.5px solid var(--line);padding:13px;border-radius:14px;display:flex;gap:10px;align-items:center;background:#fff;cursor:pointer;transition:.15s}.check:has(input:checked){border-color:var(--blue);background:#f1f6ff}.check input{accent-color:var(--blue);width:17px;height:17px;flex-shrink:0}.check span{font-size:14px;line-height:1.4}
.nav{display:flex;gap:10px;margin-top:26px}.btn{border:0;border-radius:13px;padding:14px 20px;font-weight:800;cursor:pointer;transition:filter .15s,transform .15s;min-height:48px}.btn:hover{transform:translateY(-1px)}.back{background:#edf2f7;color:#52647a;border:1px solid #e2e8f0}.next{background:linear-gradient(100deg,var(--blue),#0873ed 55%,var(--teal));color:white;flex:1;box-shadow:0 9px 22px #0751dc20}.next:hover{filter:brightness(1.05)}
.notice{font-size:12px;color:var(--muted);line-height:1.6;margin-top:16px}.result{background:linear-gradient(140deg,var(--navy),#0c2a54);color:white;border-radius:20px;padding:24px;margin-top:12px;border:1px solid #1b3b64}.result .amount{font-size:clamp(27px,6vw,42px);font-weight:900;color:#48e1c1;margin:8px 0;letter-spacing:-.035em}.result p{color:#d1deee;line-height:1.6}.whatsapp{display:block;text-decoration:none;text-align:center;background:#21c768;color:#062914;font-weight:900;padding:16px;border-radius:13px;margin-top:14px;transition:filter .15s}.whatsapp:hover{filter:brightness(1.04)}.small{font-size:12px;color:var(--muted)}.hidden{display:none!important}.foot{text-align:center;color:#8493a7;font-size:12px;padding:25px 10px 38px;line-height:1.5}.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preview img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
@media(max-width:560px){header{padding:12px 15px;min-height:66px}brand img{width:min(130px,34vw);height:40px}.tag{font-size:9px;letter-spacing:.04em;padding:6px 8px}.wrap{width:min(100% - 24px,760px);margin:24px auto}.hero{margin-bottom:20px}.hero p{font-size:14px}.card{border-radius:20px;padding:19px 16px}.progress{margin-bottom:24px}.options{grid-template-columns:1fr}.checks{grid-template-columns:1fr}.nav .btn{padding:13px 14px}.step h2{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body>
<header><brand><img src="rivosa-logo.png" alt="Rivosa Technology"></brand><div class="tag">EVALUACIÓN DE EQUIPOS</div></header>
<div class="wrap"><div class="hero"><div class="eyebrow">TRADE-IN · CAMBIA TU EQUIPO</div><h1>¿Cuánto vale tu teléfono?</h1><p>Cuéntanos sobre tu equipo y recibe una estimación para usarlo como parte de pago por otro.</p></div>
<div class="card"><div class="progress-top"><span id="stepLabel">Paso 1 de 7</span><span id="percent">14%</span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="steps"></div><div class="nav"><button class="btn back hidden" id="back">← Atrás</button><button class="btn next" id="next">Continuar →</button></div></div><div class="foot">Rivosa Technology · La estimación no representa una oferta definitiva. El equipo debe inspeccionarse en tienda.</div></div>
<script>
// CONFIGURACIÓN: reemplaza el número por el WhatsApp de la tienda, incluyendo código de país (RD = 1).
const WHATSAPP_NUMBER = "18297583689";
// Precios BASE DE EJEMPLO (RD$). Ajusta estos valores a la política de recepción de Rivosa Technology.
const BASE_VALUES = {
 "Apple|iPhone 11":3500,"Apple|iPhone 11 Pro":4500,"Apple|iPhone 11 Pro Max":6500,
 "Apple|iPhone 12 mini":4500,"Apple|iPhone 12":6500,"Apple|iPhone 12 Pro":8500,"Apple|iPhone 12 Pro Max":9490,
 "Apple|iPhone 13 mini":9500,"Apple|iPhone 13":8500,"Apple|iPhone 13 Pro":10490,"Apple|iPhone 13 Pro Max":13500,
 "Apple|iPhone 14":12500,"Apple|iPhone 14 Plus":13500,"Apple|iPhone 14 Pro":14500,"Apple|iPhone 14 Pro Max":15500,
 "Apple|iPhone 15":13500,"Apple|iPhone 15 Plus":15000,"Apple|iPhone 15 Pro":16000,"Apple|iPhone 15 Pro Max":23500,
 "Apple|iPhone 16e":15500,"Apple|iPhone 16":24000,"Apple|iPhone 16 Plus":26000,"Apple|iPhone 16 Pro":28000,"Apple|iPhone 16 Pro Max":28000,
 "Apple|iPhone 17":28000,"Apple|iPhone 17 Pro":35000,"Apple|iPhone 17 Pro Max":55000
};
const IPHONE_MODELS = Object.keys(BASE_VALUES).map(k=>k.split('|')[1]);
const state={brand:"",model:"",storage:"",battery:"",condition:[],issues:[],repair:"",locked:"",photos:[]};let step=0;
const stepDefs=[
 {title:"¿Qué marca es tu teléfono?",help:"Selecciona la marca del equipo que quieres entregar.",render:()=>options(["Apple","Samsung","Xiaomi","Motorola","Google Pixel","Huawei","OnePlus","Otra"],"brand")},
 {title:"¿Qué modelo tienes?",help:"Selecciona el modelo de tu equipo. Si es Samsung u otra marca, escríbelo.",render:()=>state.brand==="Apple"?`<label class="label">Modelo de iPhone</label><select class="field" id="modelSelect"><option value="">Selecciona tu iPhone</option>${IPHONE_MODELS.map(m=>`<option value="${esc(m)}" ${state.model===m?"selected":""}>${esc(m)}</option>`).join("")}</select>`:`<label class="label">Modelo</label><input class="field" id="modelInput" placeholder="Ej. Galaxy S23 Ultra" value="${esc(state.model)}">`},
 {title:"¿Cuánto almacenamiento tiene?",help:"Selecciona la capacidad de memoria interna.",render:()=>options(["64 GB","128 GB","256 GB","512 GB","1 TB","No sé"],"storage")},
 {title:"¿Qué salud tiene la batería?",help:"Si es iPhone, puedes verlo en Ajustes → Batería → Salud y carga.",render:()=>options(["95–100%","85–94%","75–84%","Menos de 75%","No sé / no aparece"],"battery")},
 {title:"¿En qué condición física está?",help:"Marca todos los detalles que tenga el equipo.",render:()=>multiOptions(["Está en excelente estado","Rayones leves","Golpes / abolladuras","Pantalla rota","Tapa trasera rota","Marcas fuertes / desgaste"],"condition")},
 {title:"¿Todo funciona correctamente?",help:"Marca cualquier problema que presente. Si todo funciona, selecciona esa opción.",render:()=>multiOptions(["Todo funciona bien","Touch o pantalla presenta fallas","Cámaras con problemas","Face ID / huella no funciona","Bocina / micrófono defectuoso","Puerto de carga / batería con problemas","Botones o señal presentan fallas","Otro problema"],"issues")},
 {title:"Detalles finales",help:"Indícanos si ha sido reparado y si tiene algún bloqueo de cuenta.",render:()=>`<label class="label">¿Ha sido reparado anteriormente?</label><div class="chips" style="margin:8px 0 18px">${chipSet(["Sí","No","No sé"],"repair")}</div><label class="label">¿Tiene cuenta iCloud, Google o Samsung bloqueada?</label><div class="chips" style="margin:8px 0 18px">${chipSet(["No","Sí","No sé"],"locked")}</div><label class="label">Fotos del equipo (opcional)</label><input class="field" type="file" id="photoInput" accept="image/*" multiple><div id="photoPreview" class="preview"></div><p class="small">Las fotos se revisan en tu dispositivo y no se adjuntan automáticamente a WhatsApp. Puedes enviarlas luego en el chat.</p>`}
];
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function options(list,key){return `<div class="options">${list.map(v=>`<button type="button" class="opt ${state[key]===v?'selected':''}" data-key="${key}" data-value="${esc(v)}">${v}</button>`).join("")}</div>`}
function multiOptions(list,key){return `<div class="checks">${list.map(v=>`<label class="check"><input type="checkbox" data-multi="${key}" value="${esc(v)}" ${state[key].includes(v)?"checked":""}><span>${v}</span></label>`).join("")}</div>`}
function chipSet(list,key){return list.map(v=>`<button type="button" class="chip ${state[key]===v?'selected':''}" data-key="${key}" data-value="${esc(v)}">${v}</button>`).join("")}
function draw(){const def=stepDefs[step];document.getElementById("steps").innerHTML=`<section class="step"><h2>${def.title}</h2><p class="help">${def.help}</p>${def.render()}</section>`;document.getElementById("stepLabel").textContent=`Paso ${step+1} de ${stepDefs.length}`;const pct=Math.round((step+1)/stepDefs.length*100);document.getElementById("percent").textContent=pct+"%";document.getElementById("bar").style.width=pct+"%";document.getElementById("back").classList.toggle("hidden",step===0);document.getElementById("next").textContent=step===stepDefs.length-1?"Ver estimación →":"Continuar →";}
function validate(){if(step===0&&!state.brand)return"Selecciona una marca para continuar.";if(step===1&&!state.model.trim())return"Escribe el modelo de tu teléfono.";if(step===2&&!state.storage)return"Selecciona el almacenamiento.";if(step===3&&!state.battery)return"Selecciona el estado de la batería.";if(step===4&&!state.condition.length)return"Selecciona al menos una condición física.";if(step===5&&!state.issues.length)return"Selecciona el funcionamiento del equipo.";return""}
function calculate(){
 const base=BASE_VALUES[`${state.brand}|${state.model}`];
 if(typeof base==="number") return {fixed:true,base,low:base,high:base};
 return {manual:true,base:null,low:0,high:0};
}
function money(n){return "RD$"+n.toLocaleString("es-DO");}
function resultScreen(){const r=calculate();const model=`${state.brand} ${state.model} · ${state.storage}`;const priceText=r.fixed?`Precio estimado de recibimiento: ${money(r.base)}.`:`Este modelo aún no tiene un precio estimado cargado. Podemos evaluarlo directamente por WhatsApp.`;const msg=`Hola, quiero evaluar mi teléfono en Rivosa Technology.\n\nMarca: ${state.brand}\nModelo: ${state.model}\nAlmacenamiento: ${state.storage}\nBatería: ${state.battery}\nCondición física: ${state.condition.join(", ")}\nFuncionamiento: ${state.issues.join(", ")}\nReparado anteriormente: ${state.repair}\nBloqueo de cuenta: ${state.locked}\n${priceText}\n\n¿Me pueden confirmar el valor de recepción?`;const whatsappUrl=`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;document.getElementById("steps").innerHTML=`<section class="step"><h2>¡Evaluación completada!</h2><p class="help">Aquí tienes el precio base de recibimiento para tu equipo.</p><div class="result"><div style="color:#c8d3dd;font-size:12px;font-weight:700">${esc(model)}</div>${r.fixed?`<div class="amount">${money(r.base)}</div>`:`<div class="amount">Cotización por WhatsApp</div>`}<p>${esc(priceText)}</p></div><p class="notice">El valor mostrado es el estimado establecido por Rivosa Technology. El equipo debe inspeccionarse en tienda para confirmar el recibimiento.</p><a class="whatsapp" target="_blank" rel="noopener" href="${whatsappUrl}">Enviar evaluación por WhatsApp</a><button class="btn back" style="width:100%;margin-top:10px" id="restart">Evaluar otro teléfono</button></section>`;document.getElementById("next").classList.add("hidden");document.getElementById("back").classList.add("hidden");document.getElementById("restart").onclick=()=>{Object.assign(state,{brand:"",model:"",storage:"",battery:"",condition:[],issues:[],repair:"",locked:"",photos:[]});step=0;document.getElementById("next").classList.remove("hidden");draw();};}
document.addEventListener("click",e=>{const b=e.target.closest("[data-key]");if(b){state[b.dataset.key]=b.dataset.value;draw();}const c=e.target.closest("[data-multi]");if(c){const k=c.dataset.multi,v=c.value;state[k]=c.checked?[...state[k].filter(x=>x!==v),v]:state[k].filter(x=>x!==v);}});
document.addEventListener("input",e=>{if(e.target.id==="modelInput")state.model=e.target.value;if(e.target.id==="modelSelect")state.model=e.target.value;if(e.target.id==="photoInput"){state.photos=[...e.target.files];const p=document.getElementById("photoPreview");p.innerHTML="";state.photos.forEach(f=>{const img=document.createElement("img");img.src=URL.createObjectURL(f);p.appendChild(img);});}});
document.getElementById("back").onclick=()=>{if(step>0){step--;draw();}};document.getElementById("next").onclick=()=>{const error=validate();if(error){alert(error);return;}if(step===stepDefs.length-1){resultScreen();return;}step++;draw();};draw();
</script></body></html>
