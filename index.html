<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07172d"><title>Rivosa Technology | Evalúa tu teléfono</title>
<style>
:root{--green:#00c9a7;--green2:#00b995;--blue:#0649d9;--ink:#07172d;--muted:#64748b;--line:#e5eaf0;--bg:#f5f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}header{background:var(--ink);color:white;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:84px}brand{display:flex;align-items:center;min-width:0}brand img{display:block;width:min(190px,42vw);max-width:190px;height:54px;max-height:54px;object-fit:contain;object-position:left center}brand span{color:var(--green}.tag{font-size:12px;color:#c7d1da;border:1px solid #43505c;padding:7px 10px;border-radius:30px}.wrap{max-width:720px;margin:28px auto;padding:0 16px}.hero{text-align:center;margin-bottom:22px}.hero .eyebrow{color:var(--blue);font-weight:800;font-size:12px;letter-spacing:1.5px}.hero h1{font-size:clamp(26px,5vw,40px);line-height:1.08;margin:10px 0}.hero p{color:var(--muted);margin:0 auto;max-width:520px}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,30px);box-shadow:0 10px 35px #12202c0a}.progress-top{display:flex;justify-content:space-between;color:#7b8791;font-size:12px;font-weight:700;margin-bottom:9px}.progress{height:7px;background:#e9eef1;border-radius:20px;overflow:hidden;margin-bottom:24px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .25s}.step h2{font-size:23px;margin:0 0 7px}.step .help{color:var(--muted);margin:0 0 20px;font-size:14px}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.opt{border:1.5px solid var(--line);background:white;border-radius:14px;padding:14px;text-align:left;cursor:pointer;transition:.15s;min-height:58px;font-weight:650}.opt:hover{border-color:var(--green);transform:translateY(-1px)}.opt.selected{border-color:var(--blue);background:#eef5ff;box-shadow:0 0 0 2px #0649d922}.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px;background:white;margin:7px 0 12px;outline:none}.field:focus{border-color:var(--blue)}.label{font-weight:700;font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{border:1.5px solid var(--line);background:#fff;border-radius:30px;padding:11px 14px;cursor:pointer}.chip.selected{background:#f4ffe4;border-color:var(--blue);font-weight:700}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.check{border:1px solid var(--line);padding:12px;border-radius:12px;display:flex;gap:9px;align-items:center;background:white}.check input{accent-color:#00b995}.nav{display:flex;gap:10px;margin-top:24px}.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:800;cursor:pointer;transition:filter .15s,transform .15s}.back{background:#eef2f4;color:var(--ink)}.next{background:linear-gradient(90deg,var(--blue),var(--green));color:white;flex:1}.next:hover{filter:brightness(1.05)}.notice{font-size:12px;color:var(--muted);line-height:1.5;margin-top:16px}.result{background:var(--ink);color:white;border-radius:18px;padding:22px;margin-top:12px}.result .amount{font-size:clamp(26px,7vw,40px);font-weight:900;color:var(--green);margin:5px 0}.result p{color:#cbd5df}.whatsapp{display:block;text-decoration:none;text-align:center;background:#22c55e;color:#092213;font-weight:900;padding:15px;border-radius:12px;margin-top:14px}.small{font-size:12px;color:var(--muted)}.hidden{display:none!important}.foot{text-align:center;color:#87929b;font-size:12px;padding:24px}.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preview img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}@media(max-width:480px){header{padding:12px 15px;min-height:70px}brand img{width:min(145px,40vw);max-width:145px;height:42px;max-height:42px}.tag{font-size:10px;padding:6px 8px}.options{grid-template-columns:1fr}.checks{grid-template-columns:1fr}.nav .btn{padding:13px 14px}.wrap{margin:20px auto}}
</style></head>
<body>
<header><brand><img src="rivosa-logo.png" alt="Rivosa Technology"></brand><div class="tag">EVALUACIÓN DE EQUIPOS</div></header>
<div class="wrap"><div class="hero"><div class="eyebrow">TRADE-IN · CAMBIA TU EQUIPO</div><h1>¿Cuánto vale tu teléfono?</h1><p>Cuéntanos sobre tu equipo y recibe una estimación para usarlo como parte de pago por otro.</p></div>
<div class="card"><div class="progress-top"><span id="stepLabel">Paso 1 de 7</span><span id="percent">14%</span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="steps"></div><div class="nav"><button class="btn back hidden" id="back">← Atrás</button><button class="btn next" id="next">Continuar →</button></div></div><div class="foot">Rivosa Technology · La estimación no representa una oferta definitiva. El equipo debe inspeccionarse en tienda.</div></div>
<script>
// CONFIGURACIÓN: reemplaza el número por el WhatsApp de la tienda, incluyendo código de país (RD = 1).
const WHATSAPP_NUMBER = "18090000000";
// Precios BASE DE EJEMPLO (RD$). Ajusta estos valores a la política de recepción de Rivosa Technology.
const BASE_VALUES = {
 "Apple|iPhone 11|64 GB":10000,"Apple|iPhone 11|128 GB":11500,"Apple|iPhone 12|64 GB":13000,"Apple|iPhone 12|128 GB":14500,
 "Apple|iPhone 13|128 GB":16000,"Apple|iPhone 13|256 GB":18000,"Apple|iPhone 13 Pro|128 GB":21000,"Apple|iPhone 13 Pro Max|256 GB":25000,
 "Apple|iPhone 14|128 GB":19000,"Apple|iPhone 14 Pro|128 GB":26000,"Apple|iPhone 15|128 GB":25000,"Apple|iPhone 15 Pro|256 GB":35000,
 "Samsung|Galaxy S21|128 GB":10000,"Samsung|Galaxy S22|128 GB":14000,"Samsung|Galaxy S22 Ultra|256 GB":19000,"Samsung|Galaxy S23|128 GB":20000,"Samsung|Galaxy S23 Ultra|256 GB":28000,"Samsung|Galaxy S24|256 GB":30000,
 "Xiaomi|Redmi Note 12|128 GB":6500,"Xiaomi|Redmi Note 13|128 GB":8500,"Xiaomi|Redmi Note 13 Pro|256 GB":12000,"Motorola|Moto G Power|128 GB":6000
};
const state={brand:"",model:"",storage:"",battery:"",condition:[],issues:[],repair:"",locked:"",photos:[]};let step=0;
const stepDefs=[
 {title:"¿Qué marca es tu teléfono?",help:"Selecciona la marca del equipo que quieres entregar.",render:()=>options(["Apple","Samsung","Xiaomi","Motorola","Google Pixel","Huawei","OnePlus","Otra"],"brand")},
 {title:"¿Qué modelo tienes?",help:"Escribe el modelo tal como aparece en los ajustes del teléfono.",render:()=>`<label class="label">Modelo</label><input class="field" id="modelInput" placeholder="Ej. iPhone 13 Pro, Galaxy S22 Ultra" value="${esc(state.model)}">`},
 {title:"¿Cuánto almacenamiento tiene?",help:"Selecciona la capacidad de memoria interna.",render:()=>options(["64 GB","128 GB","256 GB","512 GB","1 TB","No sé"],"storage")},
 {title:"¿Qué salud tiene la batería?",help:"Si es iPhone, puedes verlo en Ajustes → Batería → Salud y carga.",render:()=>options(["95–100%","85–94%","75–84%","Menos de 75%","No sé / no aparece"],"battery")},
 {title:"¿En qué condición física está?",help:"Marca todos los detalles que tenga el equipo.",render:()=>multiOptions(["Está en excelente estado","Rayones leves","Golpes / abolladuras","Pantalla rota","Tapa trasera rota","Marcas fuertes / desgaste"],"condition")},
 {title:"¿Todo funciona correctamente?",help:"Marca cualquier problema que presente. Si todo funciona, selecciona esa opción.",render:()=>multiOptions(["Todo funciona bien","Touch o pantalla presenta fallas","Cámaras con problemas","Face ID / huella no funciona","Bocina / micrófono defectuoso","Puerto de carga / batería con problemas","Botones o señal presentan fallas","Otro problema"],"issues")},
 {title:"Detalles finales",help:"Indícanos si ha sido reparado y si tiene algún bloqueo de cuenta.",render:()=>`<label class="label">¿Ha sido reparado anteriormente?</label><div class="chips" style="margin:8px 0 18px">${chipSet(["Sí","No","No sé"],"repair")}</div><label class="label">¿Tiene cuenta iCloud, Google o Samsung bloqueada?</label><div class="chips" style="margin:8px 0 18px">${chipSet(["No","Sí","No sé"],"locked")}</div><label class="label">Fotos del equipo (opcional)</label><input class="field" type="file" id="photoInput" accept="image/*" multiple><div id="photoPreview" class="preview"></div><p class="small">Las fotos se revisan en tu dispositivo y no se adjuntan automáticamente a WhatsApp. Puedes enviarlas luego en el chat.</p>`}
];
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function options(list,key){return `<div class="options">${list.map(v=>`<button type="button" class="opt ${state[key]===v?'selected':''}" data-key="${key}" data-value="${esc(v)}">${v}</button>`).join("")}</div>`}
function multiOptions(list,key){return `<div class="checks">${list.map(v=>`<label class="check"><input type="checkbox" data-multi="${key}" value="${esc(v)}" ${state[key].includes(v)?"checked":""}><span>${v}</span></label>`).join("")}</div>`}
function chipSet(list,key){return list.map(v=>`<button type="button" class="chip ${state[key]===v?'selected':''}" data-key="${key}" data-value="${esc(v)}">${v}</button>`).join("")}
function draw(){const def=stepDefs[step];document.getElementById("steps").innerHTML=`<section class="step"><h2>${def.title}</h2><p class="help">${def.help}</p>${def.render()}</section>`;document.getElementById("stepLabel").textContent=`Paso ${step+1} de ${stepDefs.length}`;const pct=Math.round((step+1)/stepDefs.length*100);document.getElementById("percent").textContent=pct+"%";document.getElementById("bar").style.width=pct+"%";document.getElementById("back").classList.toggle("hidden",step===0);document.getElementById("next").textContent=step===stepDefs.length-1?"Ver estimación →":"Continuar →";}
function validate(){if(step===0&&!state.brand)return"Selecciona una marca para continuar.";if(step===1&&!state.model.trim())return"Escribe el modelo de tu teléfono.";if(step===2&&!state.storage)return"Selecciona el almacenamiento.";if(step===3&&!state.battery)return"Selecciona el estado de la batería.";if(step===4&&!state.condition.length)return"Selecciona al menos una condición física.";if(step===5&&!state.issues.length)return"Selecciona el funcionamiento del equipo.";return""}
function calculate(){let base=BASE_VALUES[`${state.brand}|${state.model}|${state.storage}`];if(!base){base=guessBase();}let discount=0;const b=state.battery;if(b==="85–94%")discount+=500;else if(b==="75–84%")discount+=1500;else if(b==="Menos de 75%")discount+=3000;else if(b==="No sé / no aparece")discount+=500;if(state.condition.includes("Rayones leves"))discount+=500;if(state.condition.includes("Golpes / abolladuras"))discount+=1500;if(state.condition.includes("Marcas fuertes / desgaste"))discount+=2000;if(state.condition.includes("Pantalla rota"))discount+=Math.round(base*.35);if(state.condition.includes("Tapa trasera rota"))discount+=Math.round(base*.15);if(state.issues.includes("Touch o pantalla presenta fallas"))discount+=Math.round(base*.35);if(state.issues.includes("Cámaras con problemas"))discount+=Math.round(base*.15);if(state.issues.includes("Face ID / huella no funciona"))discount+=Math.round(base*.2);if(state.issues.includes("Bocina / micrófono defectuoso"))discount+=Math.round(base*.1);if(state.issues.includes("Puerto de carga / batería con problemas"))discount+=Math.round(base*.15);if(state.issues.includes("Botones o señal presentan fallas"))discount+=Math.round(base*.15);if(state.issues.includes("Otro problema"))discount+=Math.round(base*.1);if(state.issues.includes("Todo funciona bien"))discount=0;let low=Math.max(0,base-discount-1000),high=Math.max(low,base-discount+1000);if(state.locked==="Sí")return{blocked:true,base,low:0,high:0};if(state.condition.includes("Pantalla rota")||state.issues.some(x=>x!=="Todo funciona bien"))return{manual:true,base,low,high};return{base,low,high};}
function guessBase(){// fallback generic estimate, deliberately conservative and clearly labeled
 const tier=state.brand==="Apple"?18000:state.brand==="Samsung"?13000:state.brand==="Google Pixel"?12000:state.brand==="Xiaomi"?8000:state.brand==="Motorola"?7000:6000;
 const model=state.model.toLowerCase();let factor=1;if(/pro max|ultra|fold|premium/.test(model))factor=1.5;else if(/pro|plus|fe/.test(model))factor=1.2;else if(/se|lite|a1[0-9]|a2[0-9]/.test(model))factor=.65;const storageFactor=state.storage==="512 GB"||state.storage==="1 TB"?1.15:state.storage==="256 GB"?1.08:1;return Math.round(tier*factor*storageFactor/500)*500;}
function money(n){return "RD$"+n.toLocaleString("es-DO");}
function resultScreen(){const r=calculate();const model=`${state.brand} ${state.model} · ${state.storage}`;let resultText=r.blocked?"Este equipo requiere revisión especial y no puede recibir una estimación automática por bloqueo de cuenta.":r.manual?`Estimación orientativa: ${money(r.low)} – ${money(r.high)}. Este equipo requiere revisión más detallada por los detalles o fallas reportadas.`:`Estimación orientativa: ${money(r.low)} – ${money(r.high)}.`;const msg=`Hola, quiero evaluar mi teléfono en Rivosa Technology.%0A%0AMarca: ${state.brand}%0AModelo: ${state.model}%0AAlmacenamiento: ${state.storage}%0ABatería: ${state.battery}%0ACondición física: ${state.condition.join(", ")}%0AFuncionamiento: ${state.issues.join(", ")}%0AReparado anteriormente: ${state.repair}%0ABloqueo de cuenta: ${state.locked}%0A${resultText}%0A%0A¿Me pueden confirmar el valor de recepción?`;document.getElementById("steps").innerHTML=`<section class="step"><h2>¡Evaluación completada!</h2><p class="help">Este es un estimado inicial basado en lo que nos indicaste.</p><div class="result"><div style="color:#c8d3dd;font-size:12px;font-weight:700">${esc(model)}</div>${r.blocked?`<div class="amount">Revisión requerida</div>`:`<div class="amount">${money(r.low)} – ${money(r.high)}</div>`}<p>${esc(resultText)}</p></div><p class="notice">${r.manual||r.blocked?"El equipo necesita una inspección adicional. El rango no es una oferta de compra garantizada.":"El precio final se confirma luego de revisar físicamente el teléfono."}</p><a class="whatsapp" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP_NUMBER}?text=${msg}">Enviar evaluación por WhatsApp</a><button class="btn back" style="width:100%;margin-top:10px" id="restart">Evaluar otro teléfono</button></section>`;document.getElementById("next").classList.add("hidden");document.getElementById("back").classList.add("hidden");document.getElementById("restart").onclick=()=>{Object.assign(state,{brand:"",model:"",storage:"",battery:"",condition:[],issues:[],repair:"",locked:"",photos:[]});step=0;document.getElementById("next").classList.remove("hidden");draw();};}
document.addEventListener("click",e=>{const b=e.target.closest("[data-key]");if(b){state[b.dataset.key]=b.dataset.value;draw();}const c=e.target.closest("[data-multi]");if(c){const k=c.dataset.multi,v=c.value;state[k]=c.checked?[...state[k].filter(x=>x!==v),v]:state[k].filter(x=>x!==v);}});
document.addEventListener("input",e=>{if(e.target.id==="modelInput")state.model=e.target.value;if(e.target.id==="photoInput"){state.photos=[...e.target.files];const p=document.getElementById("photoPreview");p.innerHTML="";state.photos.forEach(f=>{const img=document.createElement("img");img.src=URL.createObjectURL(f);p.appendChild(img);});}});
document.getElementById("back").onclick=()=>{if(step>0){step--;draw();}};document.getElementById("next").onclick=()=>{const error=validate();if(error){alert(error);return;}if(step===stepDefs.length-1){resultScreen();return;}step++;draw();};draw();
</script></body></html>
